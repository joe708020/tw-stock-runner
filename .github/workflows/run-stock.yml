name: 台股量化戰報排程

on:
  # 允許透過外部 API (Cron-job.org) 觸發
  repository_dispatch:
    types: [trigger-stock-runner]
  # 允許在 GitHub 網頁上手動按按鈕執行 (方便測試)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 安裝依賴套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 執行量化選股與推播
        env:
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_WORKSHEET: "10月" # 如果你的試算表有特定分頁名稱，請在這裡修改；若無則刪除此行或留空
        run: python main.py
